<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONSTA Buttons</title>
<style>
  body{margin:0;padding:24px 16px;font-family:-apple-system,Tahoma,Arial,sans-serif;background:#f4f5f7;color:#1f2a30}
  .box{max-width:480px;margin:0 auto;background:#fff;border-radius:14px;padding:20px}
  h1{font-size:18px;margin:0 0 12px}
  ol{padding-right:20px;line-height:1.9;margin:0 0 20px;font-size:15px}
  .copy{border:2px dashed #c8ced4;border-radius:10px;padding:16px;background:#fff;text-align:center}
</style>
</head>
<body>
<div class="box">
  <h1>أزرار ONSTA للتوقيع</h1>
  <ol>
    <li>اضغط الزر الأزرق "انسخ التوقيع"</li>
    <li>أوتلوك ← الإعدادات ← التوقيع ← امسح كل شي ← الصق</li>
    <li>اكتب مسافة وامسحها، وبعدها اضغط ✓</li>
  </ol>
  <button id="cp" style="display:block;width:100%;padding:16px;margin:0 0 16px;font-size:18px;font-weight:bold;color:#fff;background:#2563eb;border:0;border-radius:10px;font-family:inherit">انسخ التوقيع</button>
  <div class="copy" id="btns"><div dir="ltr" align="center" style="direction:ltr;text-align:center"><center><b style="font-size:17px">Download the ONSTA App</b><br><span style="font-size:13px;opacity:0.7">Available on iPhone and Android</span><br><br><a href="https://hasanainhelcoo.github.io/onsta-email-assets/ios/"><img src="https://hasanainhelcoo.github.io/onsta-email-assets/app-store.png?v=2" alt="Download on the App Store" width="126" height="42" style="border:0;width:126px;height:42px"></a>&nbsp;<a href="https://hasanainhelcoo.github.io/onsta-email-assets/android/"><img src="https://hasanainhelcoo.github.io/onsta-email-assets/google-play.png?v=2" alt="Get it on Google Play" width="141" height="42" style="border:0;width:141px;height:42px"></a><br><br><b>ONSTA Team</b></center></div></div>
</div>
<script>
document.getElementById('cp').addEventListener('click', function () {
  var btn = this, box = document.getElementById('btns');
  var ok = false;
  try {
    box.setAttribute('contenteditable', 'true');
    var r = document.createRange(); r.selectNodeContents(box);
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    ok = document.execCommand('copy');
    sel.removeAllRanges();
  } catch (e) { ok = false; }
  box.removeAttribute('contenteditable');
  function done() { btn.textContent = 'تم النسخ ✓ روح الصقه بأوتلوك'; btn.style.background = '#16a34a'; }
  if (ok) { done(); return; }
  if (navigator.clipboard && window.ClipboardItem) {
    navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([box.innerHTML], {type: 'text/html'}),
      'text/plain': new Blob(['Download the ONSTA App\nAvailable on iPhone and Android\nONSTA Team'], {type: 'text/plain'})
    })]).then(done, function () { btn.textContent = 'ما انسخ، جرّب مرة ثانية'; });
  }
});
</script>
</body>
</html>
