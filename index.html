<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONSTA Buttons</title>
<style>
  body{margin:0;padding:24px 16px;font-family:-apple-system,Tahoma,Arial,sans-serif;background:#f4f5f7;color:#1f2a30}
  .box{max-width:480px;margin:0 auto;background:#fff;border-radius:14px;padding:20px}
  h1{font-size:18px;margin:0 0 12px}
  ol{padding-right:20px;line-height:1.9;margin:0 0 20px;font-size:15px}
  .copy{border:2px dashed #c8ced4;border-radius:10px;padding:16px;direction:ltr;text-align:left}
</style>
</head>
<body>
<div class="box">
  <h1>أزرار ONSTA للتوقيع</h1>
  <ol>
    <li>اضغط الزر الأزرق "انسخ الزرين"</li>
    <li>أوتلوك ← الإعدادات ← التوقيع ← الصق</li>
  </ol>
  <button id="cp" style="display:block;width:100%;padding:16px;margin:0 0 16px;font-size:18px;font-weight:bold;color:#fff;background:#2563eb;border:0;border-radius:10px;font-family:inherit">انسخ الزرين</button>
  <div class="copy" id="btns"><a href="https://apps.apple.com/app/onsta/id6801993828"><img src="https://hasanainhelcoo.github.io/onsta-email-assets/app-store.png?v=2" alt="Download on the App Store" width="132" height="44" style="border:0;width:132px;height:44px"></a>&nbsp;<a href="https://play.google.com/store/apps/details?id=ae.onsta.app"><img src="https://hasanainhelcoo.github.io/onsta-email-assets/google-play.png?v=2" alt="Get it on Google Play" width="148" height="44" style="border:0;width:148px;height:44px"></a></div>
</div>
<script>
document.getElementById('cp').addEventListener('click', async function () {
  var btn = this, box = document.getElementById('btns');
  var html = box.innerHTML;
  var text = 'App Store: https://apps.apple.com/app/onsta/id6801993828\nGoogle Play: https://play.google.com/store/apps/details?id=ae.onsta.app';
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], {type: 'text/html'}),
      'text/plain': new Blob([text], {type: 'text/plain'})
    })]);
  } catch (e) {
    var r = document.createRange(); r.selectNodeContents(box);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    document.execCommand('copy'); s.removeAllRanges();
  }
  btn.textContent = 'تم النسخ ✓ روح الصقهم بأوتلوك';
  btn.style.background = '#16a34a';
});
</script>
</body>
</html>
