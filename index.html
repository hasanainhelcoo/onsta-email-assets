<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONSTA Signature</title>
<style>
  /* No background colors anywhere: copied content must not carry a background. */
  body{margin:0;padding:24px 16px;font-family:-apple-system,Tahoma,Arial,sans-serif;max-width:460px;margin:0 auto}
  h1{font-size:19px;margin:0 0 12px}
  ol{padding-right:20px;line-height:1.9;margin:0 0 18px;font-size:15px}
  #cp{display:block;width:100%;padding:16px;margin:0 0 20px;font-size:18px;font-weight:bold;color:#fff;background:#2563eb;border:0;border-radius:12px;font-family:inherit}
  #sig{text-align:center;direction:ltr}
  #sig img{max-width:100%;height:auto}
</style>
</head>
<body>
<h1>توقيع ONSTA</h1>
<p id="notSafari" style="display:none;margin:0 0 16px;padding:14px;border-radius:12px;border:2px solid #dc2626;color:#dc2626;font-weight:bold;font-size:16px;line-height:1.7">افتح هالصفحة بـ Safari مو Chrome. النسخ من Chrome يضيف خلفية بيضاء للتوقيع.</p>
<ol>
  <li>افتح هالصفحة بـ <b>Safari</b></li>
  <li>اضغط "انسخ التوقيع"</li>
  <li>أوتلوك ← الإعدادات ← التوقيع ← امسح كل شي ← الصق ← ✓</li>
</ol>
<button id="cp" type="button">انسخ التوقيع</button>
<div id="sig" dir="rtl"><img src="https://hasanainhelcoo.github.io/onsta-email-assets/sig-top.png?v=1" alt="Download the ONSTA App" width="398" height="58" style="border:0;max-width:100%;width:398px;height:58px"><br><a href="https://play.google.com/store/apps/details?id=ae.onsta.app"><img src="https://hasanainhelcoo.github.io/onsta-email-assets/sig-googleplay.png?v=1" alt="Get it on Google Play" width="199" height="48" style="border:0;max-width:100%;width:199px;height:48px"></a><a href="https://apps.apple.com/app/onsta/id6801993828"><img src="https://hasanainhelcoo.github.io/onsta-email-assets/sig-appstore.png?v=1" alt="Download on the App Store" width="199" height="48" style="border:0;max-width:100%;width:199px;height:48px"></a><br><img src="https://hasanainhelcoo.github.io/onsta-email-assets/sig-bottom.png?v=1" alt="ONSTA Team" width="398" height="36" style="border:0;max-width:100%;width:398px;height:36px">&#10240;</div>
<script>
(function () {
  // Exactly what goes on the clipboard: one linked image plus a blank Braille
  // character (U+2800). Outlook ignores zero-width/space characters when deciding
  // whether a signature is empty, but counts U+2800, which still shows as blank.
  var HTML = '<img src="https://hasanainhelcoo.github.io/onsta-email-assets/sig-top.png?v=1" alt="Download the ONSTA App" width="398" height="58" style="border:0;max-width:100%;width:398px;height:58px"><br><a href="https://play.google.com/store/apps/details?id=ae.onsta.app"><img src="https://hasanainhelcoo.github.io/onsta-email-assets/sig-googleplay.png?v=1" alt="Get it on Google Play" width="199" height="48" style="border:0;max-width:100%;width:199px;height:48px"></a><a href="https://apps.apple.com/app/onsta/id6801993828"><img src="https://hasanainhelcoo.github.io/onsta-email-assets/sig-appstore.png?v=1" alt="Download on the App Store" width="199" height="48" style="border:0;max-width:100%;width:199px;height:48px"></a><br><img src="https://hasanainhelcoo.github.io/onsta-email-assets/sig-bottom.png?v=1" alt="ONSTA Team" width="398" height="36" style="border:0;max-width:100%;width:398px;height:36px">&#10240;';
  var TEXT = 'Download the ONSTA App\nONSTA Team';
  var btn = document.getElementById('cp');
  // Chrome/Firefox/Edge on iPhone add the page's white background to what they copy.
  if (/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent)) {
    document.getElementById('notSafari').style.display = 'block';
  }

  function done() { btn.textContent = 'تم النسخ ✓ روح الصقه بأوتلوك'; btn.style.background = '#16a34a'; }
  function fail() { btn.textContent = 'ما انسخ، اضغط مرة ثانية'; btn.style.background = '#dc2626'; }

  btn.addEventListener('click', function () {
    var handled = false;
    function onCopy(e) {
      e.clipboardData.setData('text/html', HTML);
      e.clipboardData.setData('text/plain', TEXT);
      e.preventDefault();
      handled = true;
    }
    document.addEventListener('copy', onCopy);
    // iOS needs a selection for the copy command to fire.
    var sel = window.getSelection(), r = document.createRange();
    r.selectNodeContents(document.getElementById('sig'));
    sel.removeAllRanges(); sel.addRange(r);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    sel.removeAllRanges();
    document.removeEventListener('copy', onCopy);
    if (ok && handled) { done(); return; }
    if (navigator.clipboard && window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([HTML], {type: 'text/html'}),
        'text/plain': new Blob([TEXT], {type: 'text/plain'})
      })]).then(done, fail);
    } else { fail(); }
  });
})();
</script>
</body>
</html>
